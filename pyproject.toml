[project]
name = "scanlang"
version = "0.4.0"
description = "Screener DSL and scan compiler: signal definitions -> validated polars pushdown filters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Volker Lorrmann", email = "volker.lorrmann@gmail.com" }]
requires-python = ">=3.11"
keywords = ["screener", "scanner", "stock-screening", "polars", "finance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["polars>=1.44.0"]

[project.urls]
Homepage = "https://github.com/legout/scanlang"
Repository = "https://github.com/legout/scanlang"
Issues = "https://github.com/legout/scanlang/issues"

[project.optional-dependencies]
talib = ["ta-lib>=0.7.1"]
duckdb = [
    "duckdb>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]
docs = [
    "jupyter>=1.1.1",
    "marimo>=0.24.0",
    "mkdocstrings-python>=2.0.7",
    "nbconvert>=7.17.1",
    "zensical>=0.0.57",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scanlang"
module-root = "src"
