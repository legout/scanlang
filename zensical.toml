[project]
site_url = "https://legout.github.io/scanlang/"
site_name = "scanlang"
site_description = "Screener DSL and scan compiler for Polars and DuckDB."
site_author = "Volker Lorrmann"
copyright = "Copyright &copy; 2026 Volker Lorrmann"
repo_url = "https://github.com/legout/scanlang"
repo_name = "legout/scanlang"
edit_uri = "edit/master/docs/"

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Use it" = "use.md" },
  { "Language" = "language.md" },
  { "Indicators" = "indicators.md" },
  { "API" = "reference/api.md" },
  { "More" = "more.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
# allow the indicators reference page to include the generated
# availability table (`--8<-- "path/to/_indicator_availability.md"`)
pymdownx.snippets = { base_path = ["docs"] }

[project.plugins.mkdocstrings]
enabled = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
show_root_heading = true
show_root_full_path = false
summary = true
